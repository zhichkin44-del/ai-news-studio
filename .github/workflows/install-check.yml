name: install-check

# Follows the Installation steps of README.md on a clean runner, then runs the test suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node.js version
        run: node --version

      - name: Run tests
        run: npm test
